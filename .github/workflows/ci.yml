name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RepairDesk.sln

      - name: Build
        run: dotnet build RepairDesk.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RepairDesk.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RepairDesk.Api/Dockerfile
          push: false
          tags: repairdesk-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RepairDesk.Web/Dockerfile
          push: false
          tags: repairdesk-web:ci
